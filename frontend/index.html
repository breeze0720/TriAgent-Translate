<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'%3E%E8%AF%91%3C/text%3E%3C/svg%3E"
    />
    <title>译笔工作台 · 多智能体翻译与审校</title>
    <script>
        // 首屏前应用主题，避免暗色模式闪白
        (function () {
            try {
                var pref = localStorage.getItem('ap2-theme')
                if (pref === 'light' || pref === 'dark') {
                    document.documentElement.setAttribute('data-theme', pref)
                }
            } catch (e) { /* 隐私模式下忽略 */ }
        })()
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
